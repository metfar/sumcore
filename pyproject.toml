[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumcore"
version = "0.1.0a2"
description = "Core architecture, registry and release metadata for the Sum ecosystem."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.scripts]
sumcore = "sumcore.cli:main"
sum-architecture = "sumcore.architecture:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumcore*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
